Port 8888
Listen 0.0.0.0
Timeout 600

LogLevel Warning

PidFile "/tmp/tinyproxy.pid"
MaxClients 100

# Allowlist: only hostnames matching a regex in this file are allowed.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off

# Allow HTTPS (CONNECT method) only to standard TLS ports.
ConnectPort 443
ConnectPort 563
