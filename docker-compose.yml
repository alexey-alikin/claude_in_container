services:
  claude:
    # IMAGE_TAG defaults to `base` (the shared image built from the repo-root
    # Dockerfile). The wrapper sets it to the project name when
    # projects/<name>/Dockerfile exists, so per-project images can layer on
    # extra deps without affecting other projects.
    image: claude_in_container:${IMAGE_TAG:-base}
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
    stdin_open: true
    tty: true
    command: bash
    env_file:
      - path: .env
        required: false
    volumes:
      - ./projects/${PROJECT:?set PROJECT env var, or use ./claude.sh}:/workspace
      - ./claude_home:/home/claudeuser
    networks:
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    mem_limit: 2g
    cpus: 1.0

networks:
  # Named so the hardened overlay can flip it to internal:true.
  # In default mode this is a normal bridge network with internet access.
  egress:
    driver: bridge
