services:
  project-a:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    volumes:
      - ./projects/project-a:/workspace
      - ./claude_home:/home/claudeuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
