services:
  claude:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
    stdin_open: true
    tty: true
    command: bash
    env_file:
      - path: .env
        required: false
    volumes:
      - ./projects/${PROJECT:?set PROJECT env var, or use ./claude.sh}:/workspace
      - ./claude_home:/home/claudeuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
