name: Bug report
description: Something in this repo behaves differently than expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the fields below.
        For security issues, do NOT open a public issue — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands you ran, starting from a fresh clone if possible.
      placeholder: |
        1. git clone ...
        2. ./claude.sh shell example
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode
      description: Default or hardened (HARDENED=1)?
      placeholder: default
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker version (`docker --version`), Compose version (`docker compose version`).
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
